# Общие env для контейнеров приложения: хосты = имена сервисов compose-сети
# (переопределяют localhost-значения из .env; environment важнее env_file).
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://vacancy:vacancy@postgres:5432/vacancy
  CELERY_BROKER_URL: amqp://vacancy:vacancy@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/1
  RABBITMQ_URL: amqp://vacancy:vacancy@rabbitmq:5672/

services:
  # ── Инфраструктура ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacancy
      POSTGRES_PASSWORD: vacancy
      POSTGRES_DB: vacancy
    ports:
      - "5433:5432"          # 5433 на хосте: 5432 занят TomaDB/autonsi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacancy"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: vacancy
      RABBITMQ_DEFAULT_PASS: vacancy
    ports:
      - "5672:5672"          # AMQP
      - "15672:15672"        # management UI: http://localhost:15672 (vacancy/vacancy)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Одноразовая миграция БД (перед стартом приложения) ────────────
  migrate:
    build: .
    command: uv run alembic upgrade head
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Приложение ────────────────────────────────────────────────
  api:
    build: .
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  bot:
    build: .
    command: uv run python -m bot.main
    env_file: .env
    environment:
      <<: *app-env
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # Celery-воркер + встроенный Beat (scrape по расписанию, скачивание, match)
  worker:
    build: .
    command: uv run celery -A core.celery_app:celery_app worker -B -l info
    env_file: .env
    environment:
      <<: *app-env
    shm_size: "1gb"          # Playwright/Firefox стабильнее с большим /dev/shm
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
