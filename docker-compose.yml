
services:
  # ── Инфраструктура ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vacancy
      POSTGRES_PASSWORD: vacancy
      POSTGRES_DB: vacancy
    ports:
      - "5433:5432"          # 5433 на хосте: 5432 занят TomaDB/autonsi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacancy"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vacancy
      RABBITMQ_DEFAULT_PASS: vacancy
    ports:
      - "5672:5672"          # AMQP
      - "15672:15672"        # management UI: http://localhost:15672 (vacancy/vacancy)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vacancy
      MINIO_ROOT_PASSWORD: vacancy123   # MinIO требует пароль >= 8 символов
    ports:
      - "9000:9000"          # S3 API
      - "9001:9001"          # web-консоль: http://localhost:9001
    volumes:
      - miniodata:/data

  # ── Приложение ────────────────────────────────────────────────
  api:
    build: .
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  bot:
    build: .
    command: uv run python -m bot.main
    env_file: .env
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
