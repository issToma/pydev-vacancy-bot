[project]
name = "vacancy-bot"
version = "0.1.0"
description = "Telegram-бот-гейтвей к бэкенд-сервисам: поиск и аналитика вакансий со hh.ru, Q&A с LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.6.2",
    "aiogram>=3.28.2",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.136.3",
    "openai>=2.44.0",
    "playwright>=1.61.0",
    "pydantic-settings>=2.14.1",
    "python-dateutil>=2.9.0.post0",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
